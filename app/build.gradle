plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// Load keystore properties for signing
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.pagertounsi'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.pagertounsi"
        minSdk 24
        targetSdk 35
        versionCode 7  // Increment this with each update
        versionName "1.2.0"  // Update this with each release

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Signing configuration for release builds
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Add version name to APK filename
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "Pagertounsi-v${variant.versionName}-${variant.name}.apk"
                }
            }
        }
        debug {
            minifyEnabled false

        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Navigation Compose
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Socket.IO
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // OkHttp for network requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Firebase
    implementation 'com.google.firebase:firebase-messaging-ktx:23.4.0'
    implementation 'com.google.firebase:firebase-analytics-ktx:21.5.0'

    // Material Icons Extended (for additional icons)
    implementation 'androidx.compose.material:material-icons-extended:1.5.4'

    // For file provider (APK installation)
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.browser:browser:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Task to print version info (helpful for deployment)
task printVersionInfo {
    doLast {
        println "========================================"
        println "App Version: ${android.defaultConfig.versionName}"
        println "Version Code: ${android.defaultConfig.versionCode}"
        println "Application ID: ${android.defaultConfig.applicationId}"
        println "========================================"
    }
}

// Task to increment version code (for automated builds)
task incrementVersionCode {
    doLast {
        def versionPropsFile = file('version.properties')
        def versionProps = new Properties()

        if (versionPropsFile.exists()) {
            versionProps.load(new FileInputStream(versionPropsFile))
        } else {
            versionProps['VERSION_CODE'] = '1'
        }

        def code = versionProps['VERSION_CODE'].toInteger() + 1
        versionProps['VERSION_CODE'] = code.toString()
        versionProps.store(versionPropsFile.newWriter(), null)

        println "Version code incremented to $code"
    }
}